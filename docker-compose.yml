services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ftp
      POSTGRES_USER: ftp
      POSTGRES_PASSWORD: ftp
    ports:
      - "15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ftp -d ftp"]
      interval: 5s
      timeout: 3s
      retries: 10

  ftp-server:
    build:
      context: ./apps/ftp
    volumes:
      - localdata:/data
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://ftp:ftp@postgres:5432/ftp?sslmode=disable
      FTP_LISTEN: ":${FTP_PORT:-2121}"
      FTP_ENABLED: ${FTP_ENABLED:-true}
      SFTP_LISTEN: ":${SFTP_PORT:-2222}"
      SFTP_ENABLED: ${SFTP_ENABLED:-true}
      FTP_PUBLIC_IP: ${FTP_PUBLIC_IP:-}
      FTP_PASSIVE_PORT_RANGE: "50000-50999"
      FTP_ALLOW_PLAIN: "true"
      ADMIN_LISTEN: ":7000"
      ADMIN_COOKIE_SECURE: "false"
      ADMIN_LOCAL_LOGIN: ${ADMIN_LOCAL_LOGIN:-true}
      FTP_SEED: ${FTP_SEED:-true}
      FTP_SEED_USER: ${FTP_SEED_USER:-localadmin}
      FTP_SEED_PASS: ${FTP_SEED_PASS:-ChangeMe123}
      COS_USE_POD_IDENTITY: "false"
      COS_STATIC_SECRET_ID: ${COS_STATIC_SECRET_ID:-changeme}
      COS_STATIC_SECRET_KEY: ${COS_STATIC_SECRET_KEY:-changeme}
      COS_STATIC_SESSION_TOKEN: ${COS_STATIC_SESSION_TOKEN:-}
      # Storage backends users can be assigned to: "cos", "local", or "cos,local".
      # STORAGE_BACKEND is the default for users that don't pick one.
      STORAGE_BACKEND: ${STORAGE_BACKEND:-cos.objectstorage.plugin}
      STORAGE_ENABLED_BACKENDS: ${STORAGE_ENABLED_BACKENDS:-}
      STORAGE_LOCAL_ROOT: ${STORAGE_LOCAL_ROOT:-/data}
      COS_BUCKET: ${COS_BUCKET:-test-1409486316}
      COS_REGION: ${COS_REGION:-ap-bangkok}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:9001}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_ADMIN_GROUP: ${OIDC_ADMIN_GROUP:-admin}
      OIDC_READONLY_GROUP: ${OIDC_READONLY_GROUP:-readonly}
      OIDC_FRONTEND_REDIRECT_URL: ${OIDC_FRONTEND_REDIRECT_URL:-/auth/callback}
      FTP_DEFAULT_ROOT_PREFIX: ${FTP_DEFAULT_ROOT_PREFIX:-/t/t/}
      FILE_EVENTS_ENABLED: ${FILE_EVENTS_ENABLED:-true}
      FILE_EVENTS_MIME_SNIFF_MODE: ${FILE_EVENTS_MIME_SNIFF_MODE:-fallback}
      FILE_EVENTS_MIME_SNIFF_MAX_BYTES: ${FILE_EVENTS_MIME_SNIFF_MAX_BYTES:-8388608}
      FILE_EVENT_RETENTION_DAYS: ${FILE_EVENT_RETENTION_DAYS:-30}
      WORKFLOW_API_URL: http://workflow:8081
      WORKFLOW_SERVICE_TOKEN: ${WORKFLOW_SERVICE_TOKEN:-dev-workflow-token}
    ports:
      - "${FTP_PORT:-2121}:${FTP_PORT:-2121}"
      - "${SFTP_PORT:-2222}:${SFTP_PORT:-2222}"
      - "7000:7000"
      - "50000-50999:50000-50999"

  workflow:
    build:
      context: ./apps/workflow
    depends_on:
      postgres:
        condition: service_healthy
      ftp-server:
        condition: service_started
    environment:
      DATABASE_URL: postgres://ftp:ftp@postgres:5432/ftp?sslmode=disable
      WORKFLOW_LISTEN: ":8081"
      WORKFLOW_FILE_API_URL: http://ftp-server:7000
      WORKFLOW_SERVICE_TOKEN: ${WORKFLOW_SERVICE_TOKEN:-dev-workflow-token}
      WORKFLOW_WORKERS: "4"
      WORKFLOW_POLL_INTERVAL: 500ms
      WORKFLOW_MAX_ATTEMPTS: "3"
      WORKFLOW_COMPONENT_TIMEOUT: 60s
      WORKFLOW_RUN_TIMEOUT: 10m
      WORKFLOW_RUN_RETENTION_DAYS: "90"
      WORKFLOW_SMTP_HOST: ${WORKFLOW_SMTP_HOST:-}
      WORKFLOW_SMTP_PORT: ${WORKFLOW_SMTP_PORT:-587}
      WORKFLOW_SMTP_FROM: ${WORKFLOW_SMTP_FROM:-}
      WORKFLOW_WEBHOOK_ALLOW_PRIVATE: "true"
      # Plain-http webhook targets are blocked unless explicitly allowed (dev only).
      WORKFLOW_WEBHOOK_ALLOW_HTTP: ${WORKFLOW_WEBHOOK_ALLOW_HTTP:-false}
    ports:
      - "8081:8081"

  web:
    build:
      context: ./apps/web
    depends_on:
      - ftp-server
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-9001}
      FTP_UPSTREAM: ${FTP_UPSTREAM:-http://ftp-server:7000}
    ports:
      - "9001:9001"

volumes:
  pgdata:
  localdata:
