apiVersion: apps/v1
kind: Deployment
metadata:
  name: ftp-server
  namespace: ftp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ftp-server
  template:
    metadata:
      labels:
        app: ftp-server
    spec:
      serviceAccountName: ftp-server-sa
      containers:
        - name: ftp-server
          image: REPLACE_ME/cos-ftp-server:latest
          ports:
            - name: ftp-control
              containerPort: 2121
            - name: ftp-passive
              containerPort: 50000
              protocol: TCP
            - name: admin
              containerPort: 8080
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ftp-db
                  key: DATABASE_URL
          envFrom:
            - configMapRef:
                name: ftp-config
          readinessProbe:
            httpGet:
              path: /metrics
              port: admin
            periodSeconds: 10
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1
              memory: 512Mi