apiVersion: v1
kind: Service
metadata:
  name: ftp-server
  namespace: ftp
spec:
  selector:
    app: ftp-server
  ports:
    - name: ftp-control
      port: 2121
      targetPort: 2121
    - name: ftp-passive-50000
      port: 50000
      targetPort: 50000
    - name: ftp-passive-50001
      port: 50001
      targetPort: 50001
    # ... add one entry per passive port 50000-50999 in production.
    # YAGNI in this template: only 50000/50001 listed; production must complete.
    - name: admin
      port: 8080
      targetPort: 8080